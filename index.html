<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyungwoon Lee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./heatmap-toggle.css"> <!-- removable: cursor heatmap feature -->
</head>
<body>

    <nav>
        <div class="nav-inner">
            <a class="nav-home" href="/"><img src="./assets/frenny.jpg" alt="Home" class="nav-home-photo"></a>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#research">Research</a>
                <a href="#projects">Projects</a>
                <a href="#publications">Publications</a>
            </div>
        </div>
    </nav>

    <!-- removable: cursor heatmap feature -->
    <button id="heatmap-toggle" type="button" aria-pressed="false" title="Toggle a heatmap of your cursor movement since the page loaded. Reloading resets it.">Cursor Heatmap</button>
    <canvas id="heatmap-canvas" aria-hidden="true"></canvas>

    <main>

        <section class="hero">
            <div class="hero-text">
                <h1 id="hero-name"></h1>
                <p class="hero-role" id="hero-role"></p>
                <!-- <p class="hero-next" id="hero-next"></p> -->
                <div class="hero-contact" id="hero-contact"></div>
            </div>
            <img class="hero-photo" alt="">
        </section>

        <!-- <section id="news">
            <h2>News</h2>
            <ul class="news-list" id="news-list"></ul>
        </section> -->

        <section id="about">
            <h2>About</h2>
            <div id="about-content"></div>
        </section>

        <section id="research">
            <h2>Research</h2>
            <p class="section-lead" id="research-lead"></p>
            <div class="research-areas" id="research-areas"></div>
            <div id="about-aside"></div>
        </section>

        <section id="projects">
            <h2>Selected Projects</h2>
            <div class="project-list" id="project-list"></div>
        </section>

        <section id="publications">
            <h2>Publications</h2>
            <div class="pub-list" id="pub-list"></div>
        </section>

    </main>

    <footer>
        <div class="footer-inner">
            <span id="footer-email"></span>
            <span id="footer-updated"></span>
        </div>
        <div class="footer-signal-note">
            Curious about <a href="research/attention-classifier.html">how the signal strip works</a>?
        </div>
    </footer>

    <div id="signal-strip" aria-hidden="true">
        <button id="signal-info" title="This site infers a rough proxy for user arousal from your scroll and mouse behaviour, then adapts the waveform visualization in real time — an illustrative demo of the adaptive-AI concepts behind the research here. Not real biosensing.">?</button>
        <div id="signal-status">
            <span id="signal-dot" data-phase="calibrating"></span>
            <span id="signal-label">calibrating&#x2026;</span>
        </div>
    </div>

    <script src="./content.js"></script>
    <script src="./site-init.js"></script>
    <script src="./heatmap-toggle.js"></script> <!-- removable: cursor heatmap feature -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="./adaptive-signal.js"></script>
    <script src="./ml/cursor-classifier.js"></script>
    <script>
        CursorClassifier.init('ml/attention_model_browser.json', 'ml/attention_model_xgb.json');
    </script>

</body>
</html>
